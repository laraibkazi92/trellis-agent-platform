x-common-env: &common-env
  ETCD_HOST: etcd
  ETCD_PORT: 2379
  DEV_MODE: ${DEV_MODE:-false}
  # Host address the published ports bind to (nginx 80/443, hindsight 8888/9999).
  # etcd and redis are intentionally NOT published to the host -- they are only
  # reachable inside the compose network. DEV_MODE does not restrict this bind
  # (core/devmode.py only logs a warning), so set HOST_BIND=127.0.0.1 yourself if
  # you want unauthenticated services kept loopback-only.
  HOST_BIND: ${HOST_BIND:-0.0.0.0}
  TZ: UTC

# Host uid:gid the app containers run as, so files written into the bind-mounted
# workspace/ are owned by the operator instead of root. Match your host user:
#   TRELLIS_UID=$(id -u) TRELLIS_GID=$(id -g)
# The /app/data health volume inherits the image's build-time ownership on FIRST
# creation. If it already exists root-owned, remove ONLY that volume and recreate:
#   docker compose down && docker volume rm "$(basename "$PWD")_health-data"
# Do NOT use `docker compose down -v` -- that also deletes the etcd-data volume
# (users, API keys, run history). See docs/upgrading.md.
x-app-build: &app-build
  context: .
  args:
    PUID: ${TRELLIS_UID:-1000}
    PGID: ${TRELLIS_GID:-1000}
    # Shown in Admin -> Edges so an operator can spot a stale proxy. `docker compose
    # build` cannot know the release tag; the publish workflow passes the real one.
    TRELLIS_VERSION: ${TRELLIS_VERSION:-dev}

# Workspace bind mounts: every app service mounts the workspace at the SAME
# container path (/app/workspace), from ${TRELLIS_WORKSPACE_DIR:-./workspace}. Point
# TRELLIS_WORKSPACE_DIR at your org's own content checkout (another repo) to keep the
# engine and content separate -- see docs/deploy.md. Relative paths resolve from this
# file's directory. The compose merge rule that makes this work: volumes are merged by
# container path, so a docker-compose.override.yml replacing /app/workspace keeps the
# other mounts (e.g. health-data:/app/data) intact.
services:
  # Execution Runner (v0.6) -- the ONLY component with the Docker socket.
  # Every tool call becomes its own gVisor (runsc) container, created from a spec the
  # runner derives from the registered manifest: the suite is mounted read-only, the
  # tmpfs is sized, and the network is either Docker's default bridge (`egress`) or
  # none at all (`network: none`). Callers name a tool, never an image, mount,
  # capability or network.
  # The control API is a Unix socket on the `runner-run` volume -- not a published port.
  # `network_mode: none` means no tool network can reach it, and only the containers
  # mounting that volume can drive it. Do not publish it.
  # It has NO etcd dependency and NO authorization role on purpose: it reads tool/MCP
  # manifests from its workspace mount to build a container, and decides nothing. Tool
  # execution must not stop when the registry does, and an allowlist is resolved by the
  # hub and by the process that owns the agent runtime (core/tool_gate.py), never here.
  runner:
    build: *app-build
    image: ${TRELLIS_IMAGE:-ghcr.io/laraibkazi92/trellis-agent-platform:v0.7.1}
    container_name: runner
    # Root only to open /var/run/docker.sock; every container it starts runs as
    # TRELLIS_UID/TRELLIS_GID from inside the spec, never as root.
    user: "0:0"
    # Match the host's docker group so a non-root daemon socket stays reachable if you
    # ever drop `user: 0:0`.
    group_add:
      - "${DOCKER_GID:-999}"
    command: python -m core.execution.runner
    # The API is UDS-only: no listener can be reached from a tool network.
    network_mode: "none"
    read_only: true
    # /tmp is tmpfs because the rootfs is read-only and the runner shells out
    # (preflight, canary) to a few helpers. The socket directory is NOT a tmpfs:
    # it must be the shared `runner-run` volume below, or no other service could
    # dial the API (a tmpfs is private to this container).
    tmpfs:
      - /tmp:exec,mode=1777
    cap_drop: [ALL]
    # The only capabilities the runner needs. CHOWN: as root it chgrps the control
    # socket to TRELLIS_GID so the app uid (not the world) can drive it. DAC_OVERRIDE:
    # the workspace is owned by TRELLIS_UID, and the runner writes the host-path
    # canary and creates the agents' report/output dirs there -- without it root is
    # bound by the workspace's mode and every startup fails the canary. Both are
    # already implied by the Docker socket it holds. Containers it starts still get
    # CapDrop=ALL from the spec.
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - "no-new-privileges:true"
    volumes:
      # Docker socket: runner-only. Nothing else in this file may mount it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Workspace is READ-WRITE here: the runner writes the host-path canary and
      # creates reports/<agent> / output/<agent> before mounting them into a tool.
      # Tool containers still get only read-only tools/<suite> + shared/ mounts and,
      # when a manifest asks for it, a single rw output dir.
      - ${TRELLIS_WORKSPACE_DIR:-./workspace}:/app/workspace
      # The control socket, shared with host/hub/gateway/taskiq-worker.
      - runner-run:/run/trellis
    environment:
      RUNNER_SOCKET: /run/trellis/runner.sock
      # Required: an unauthenticated control socket can create containers. Generate
      # with `openssl rand -hex 32`. Also set it on host/hub/gateway/taskiq-worker.
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env (openssl rand -hex 32)}
      # The HOST path of the workspace directory (same files as /app/workspace here).
      # Docker resolves every tool bind mount against this, so a container path here
      # makes every mount point at the wrong files (the startup canary refuses to run).
      TRELLIS_HOST_WORKSPACE: ${TRELLIS_HOST_WORKSPACE:?set TRELLIS_HOST_WORKSPACE to the HOST path of the workspace (e.g. /opt/trellis/workspace)}
      # Runtime for manifests that omit `container_runtime`. runsc (gVisor) is the
      # isolation boundary in production; dev machines without gVisor set this to
      # runc. A per-tool `container_runtime` overrides it.
      CONTAINER_DEFAULT_RUNTIME: ${CONTAINER_DEFAULT_RUNTIME:-runsc}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-${TRELLIS_IMAGE:-ghcr.io/laraibkazi92/trellis-agent-platform:v0.7.1}}
      RUNNER_MAX_CONTAINERS: ${RUNNER_MAX_CONTAINERS:-32}
      RUNNER_MAX_CONTAINERS_PER_TOOL: ${RUNNER_MAX_CONTAINERS_PER_TOOL:-8}
      RUNNER_REAP_INTERVAL_S: ${RUNNER_REAP_INTERVAL_S:-300}
      # uid/gid the tool containers run as (must own the workspace tree).
      TRELLIS_UID: ${TRELLIS_UID:-1000}
      TRELLIS_GID: ${TRELLIS_GID:-1000}
      # Stamped on every container as `trellis.install` so a sweep can find them.
      TRELLIS_INSTALL_ID: ${TRELLIS_INSTALL_ID:-default}
      # Agent-token verification (signature/expiry) for every exec and session. The
      # runner holds no registry and no manifests, so it makes no allowlist decision:
      # the hub authorizes tool calls and the caller authorizes its own sessions.
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:?set AGENT_TOKEN_SECRET in .env (openssl rand -hex 32)}
      ENFORCE_AGENT_TOKENS: ${ENFORCE_AGENT_TOKENS:-enforce}
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -m core.execution.runner --healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 5
      # Startup preflight starts a trivial container under the configured runtime; a
      # cold host can take a while the first time.
      start_period: 60s
    restart: unless-stopped

  # DB Sync Init Container
  # Runs once at startup to sync agents/tools/workflows/mcps to etcd. Refuses to prune
  # when the workspace syncs nothing at all while the registry still has entries -- see
  # the guard in scripts/sync_to_db.py. A refusal exits non-zero, which blocks the stack
  # from starting onto a wiped registry; fix TRELLIS_WORKSPACE_DIR, or set
  # SYNC_FORCE_PRUNE=true in .env if the wipe is intended.
  db-sync:
    build: *app-build
    image: ${TRELLIS_IMAGE:-ghcr.io/laraibkazi92/trellis-agent-platform:v0.7.1}
    container_name: db-sync
    user: "${TRELLIS_UID:-1000}:${TRELLIS_GID:-1000}"
    environment:
      <<: *common-env
      # Escape hatch for the prune guard: set SYNC_FORCE_PRUNE=true in .env to allow a
      # sync that prunes with an empty workspace (e.g. you really did delete them all).
      SYNC_FORCE_PRUNE: ${SYNC_FORCE_PRUNE:-}
    volumes:
      - ${TRELLIS_WORKSPACE_DIR:-./workspace}:/app/workspace
    command: python scripts/sync_to_db.py
    depends_on:
      etcd:
        condition: service_healthy
    restart: "no"

  # Universal Agent Host (FastAPI + PydanticAI)
  # This is the main entry point for the agent fleet.
  host:
    build: *app-build
    image: ${TRELLIS_IMAGE:-ghcr.io/laraibkazi92/trellis-agent-platform:v0.7.1}
    container_name: agent-host
    user: "${TRELLIS_UID:-1000}:${TRELLIS_GID:-1000}"
    env_file:
      - .env
    environment:
      <<: *common-env
      HOST_URL: http://host:8000
      HUB_URL: http://hub:8001/mcp
      # Framework LLM provider keys (one per provider in the registry) are NOT set here:
      # configure them in the Admin UI -> LLM Providers, stored Fernet-encrypted in etcd.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      REDIS_URL: redis://redis:6379/0
      HINDSIGHT_URL: http://hindsight:8888
      # v0.6: tool execution goes through the runner over this Unix socket (the
      # `runner-run` volume). The token is defense-in-depth over the socket perms.
      RUNNER_SOCKET: ${RUNNER_SOCKET:-/run/trellis/runner.sock}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # HMAC key for the server-side allowlist tokens (phase 3). Harmless until then.
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:?set AGENT_TOKEN_SECRET in .env (openssl rand -hex 32)}
      # Server-side allowlist enforcement: off | log | enforce (phase 3).
      ENFORCE_AGENT_TOKENS: ${ENFORCE_AGENT_TOKENS:-enforce}
      # The ONE tool-authorization switch (v0.7.1): off | shadow | enforce. Repeated
      # here (not only in .env) so a shell override reaches this process too, exactly
      # like the other enforcement points.
      TOOL_ACCESS_MODE: ${TOOL_ACCESS_MODE:-enforce}
    volumes:
      - health-data:/app/data
      - ${TRELLIS_WORKSPACE_DIR:-./workspace}:/app/workspace
      - runner-run:/run/trellis
    command: granian --interface asgi core.host:app --host 0.0.0.0 --port 8000 --workers 2 --runtime-threads 1 --workers-max-rss 256 --workers-lifetime 3600
    depends_on:
      hub:
        condition: service_started
      etcd:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
      runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Polyglot Tool Hub (Internal MCP Server)
  # Executes local polyglot tools and exposes them to the Host via SSE
  hub:
    build: *app-build
    image: ${TRELLIS_IMAGE:-ghcr.io/laraibkazi92/trellis-agent-platform:v0.7.1}
    container_name: tool-hub
    # Runs as the operator uid -- the same identity that owns the bind-mounted
    # workspace. Tool processes do NOT run here (every call is a runner-managed
    # container), so the hub needs no capabilities and no identity drop.
    user: "${TRELLIS_UID:-1000}:${TRELLIS_GID:-1000}"
    # PID 1 must reap orphaned children (auxiliary probes and short-lived helper
    # processes); with `init: true` tini is PID 1 and does the reaping.
    init: true
    command: python core/hub.py
    restart: unless-stopped
    # /healthz is a liveness probe only: the hub owns no sandbox, so it answers 200
    # while the process serves. Executable health belongs to the runner
    # (`GET /v1/healthz` over its socket).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8001/healthz > /dev/null"]
      interval: 30s
      timeout: 25s
      retries: 3
      # Go tools are pre-compiled before uvicorn binds; a cold rebuild can take a
      # while. Do not report a slow-but-healthy hub as a failure.
      start_period: 60s
    # Every tool call is a runner-managed container, so the hub builds no sandbox
    # root and needs no capability and no relaxed LSM profile: cap_drop is [ALL]
    # with an empty cap_add, and `no-new-privileges` stops setuid/file-cap
    # privilege gain in the hub process itself.
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    # NOTE: no `env_file: .env` here on purpose. The hub keeps only the variables it
    # needs: tool environments are built per call from the manifest's declared keys,
    # and framework secrets (e.g. GEMINI_API_KEY, SESSION_SECRET) never enter the hub
    # process to begin with.
    # Only the variables the hub actually needs are passed explicitly below.
    environment:
      <<: *common-env
      HOST_URL: http://host:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev-user@local.host}
      # Decrypts identity-scoped tool secrets for injection into the tool subprocess.
      # ENCRYPTION_KEY falls back to SESSION_SECRET when unset.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Env-var defaults the hub reads; Admin UI (etcd) overrides still win.
      TOOL_EXECUTION_TIMEOUT: ${TOOL_EXECUTION_TIMEOUT:-}
      HEALTH_FAILURE_THRESHOLD: ${HEALTH_FAILURE_THRESHOLD:-}
      HEALTH_COOLDOWN_SECONDS: ${HEALTH_COOLDOWN_SECONDS:-}
      # Runner control API (the `runner-run` volume) and its bearer token.
      # RUNNER_TOKEN must match the runner service and the other callers.
      RUNNER_SOCKET: ${RUNNER_SOCKET:-/run/trellis/runner.sock}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # HMAC key for agent tokens (phase 3): the hub verifies them on every tool
      # call and resolves the agent's effective allowlist itself.
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:?set AGENT_TOKEN_SECRET in .env (openssl rand -hex 32)}
      # Server-side allowlist enforcement: off | log | enforce (phase 3).
      ENFORCE_AGENT_TOKENS: ${ENFORCE_AGENT_TOKENS:-enforce}
      # The ONE tool-authorization switch (v0.7.1): off | shadow | enforce. Group
      # rules come from workspace/policies/tool_access.yaml; the agent allowlist half
      # is always enforced. Already `enforce` by default: the value below is the
      # effective default, so an unset .env still enforces (a typo behaves as enforce
      # too, since access must never widen by accident).
      TOOL_ACCESS_MODE: ${TOOL_ACCESS_MODE:-enforce}
      # How often the hub re-reads the tool registry so a newly connected edge's tools
      # become executable without a restart. 0 disables the watcher.
      EDGE_TOOL_RECONCILE_SECONDS: ${EDGE_TOOL_RECONCILE_SECONDS:-10}
    # Per-container backstop against fork bombs: RLIMIT_NPROC counts the whole
    # host uid, while pids.max counts only this container's processes/threads.
    pids_limit: 1024
    # Optional hard memory bound for the hub container. Uncomment and size it
    # around your heaviest workload.
    # mem_limit: 4g
    depends_on:
      etcd:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
      runner:
        condition: service_healthy
    volumes:
      - health-data:/app/data
      - ${TRELLIS_WORKSPACE_DIR:-./workspace}:/app/workspace
      # Runner control socket (rw: the hub is a client).
      - runner-run:/run/trellis

  # Edge Relay (trellis-proxy tunnel terminator)
  # Terminates outbound-initiated WSS tunnels from edge nodes -- internal VMs that can
  # reach this host on 443 but accept no inbound connections (see docs/proxy.md and
  # deploy/proxy/). Each site dials out to /edge/v1/connect; the relay keeps that live
  # socket in process memory and forwards the tool calls it is handed. It is never
  # published to the host: nginx fronts it at /edge (gateway/entrypoint.sh).
  edge-relay:
    build: *app-build
    image: ${TRELLIS_IMAGE:-ghcr.io/laraibkazi92/trellis-agent-platform:v0.7.1}
    container_name: edge-relay
    user: "${TRELLIS_UID:-1000}:${TRELLIS_GID:-1000}"
    # Exactly ONE worker, on purpose: the site -> live connection map is in-process
    # memory, so a second worker would answer 503 edge_offline for every site whose
    # socket happens to be held by the other worker.
    command: uvicorn services.edge_relay.app:app --host 0.0.0.0 --port 8100 --workers 1
    # NOTE: no `env_file: .env` here on purpose, same reasoning as the hub. The relay
    # resolves edge token hashes from etcd and never decrypts tool secrets, so handing
    # it the whole .env would only widen the blast radius of a relay compromise. Only
    # the variables it actually needs are passed explicitly below.
    environment:
      <<: *common-env
      DEV_MODE: ${DEV_MODE:-false}
      # Dev-only tunnel credential for an edge running on this host. Ignored unless
      # DEV_MODE=true; see the trellis-proxy section of .env.example.
      EDGE_DEV_SITE: ${EDGE_DEV_SITE:-}
      EDGE_DEV_TOKEN: ${EDGE_DEV_TOKEN:-}
      # Per-site call budget (the site record can override it) and the audit trail.
      # The audit line carries site/tool/call id/user/outcome/bytes -- never payloads.
      EDGE_RATE_LIMIT_PER_MIN: ${EDGE_RATE_LIMIT_PER_MIN:-120}
      EDGE_AUDIT_LOG: /app/data/edge-audit.log
      # Needed to decrypt LLM provider keys for the embeddings of `public` edge tools.
      # Without them (and with DEV_MODE=false) every index call fails and the tool
      # still works but ranks last in tool search. Same values as host/hub.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # HMAC key for agent tokens (phase 3 verifies them on both relay routes; the
      # `;`-separated form is a rotation list).
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:?set AGENT_TOKEN_SECRET in .env (openssl rand -hex 32)}
      # off | log | enforce. Enforce makes this relay the authority for edge tool and
      # MCP calls: no/invalid token or an out-of-allowlist reference is a 403.
      ENFORCE_AGENT_TOKENS: ${ENFORCE_AGENT_TOKENS:-enforce}
      # The ONE tool-authorization switch (v0.7.1): off | shadow | enforce.
      TOOL_ACCESS_MODE: ${TOOL_ACCESS_MODE:-enforce}
    volumes:
      # Health events for remote tool calls. Deliberately no workspace mount: the relay
      # has no local tools and must not be able to read the content repo.
      - health-data:/app/data
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8100/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # External Gateway MCP Server
  # Bridges external MCP clients to the internal agent fleet via the Host's HTTP API.
  gateway:
    build: *app-build
    image: ${TRELLIS_IMAGE:-ghcr.io/laraibkazi92/trellis-agent-platform:v0.7.1}
    container_name: agent-gateway
    user: "${TRELLIS_UID:-1000}:${TRELLIS_GID:-1000}"
    environment:
      <<: *common-env
      HOST_URL: http://host:8000
      HUB_URL: http://hub:8001/mcp
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # v0.6: tool execution is runner-side; the gateway only forwards calls.
      RUNNER_SOCKET: ${RUNNER_SOCKET:-/run/trellis/runner.sock}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # Phase 3: the gateway mints tokens for the external caller it serves and the
      # hub/relay verify them. `gateway` is an ordinary agent name there: no agent
      # record, so the tool's own `public` exposure is its only grant.
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:?set AGENT_TOKEN_SECRET in .env (openssl rand -hex 32)}
      ENFORCE_AGENT_TOKENS: ${ENFORCE_AGENT_TOKENS:-enforce}
      # The ONE tool-authorization switch (v0.7.1): off | shadow | enforce.
      TOOL_ACCESS_MODE: ${TOOL_ACCESS_MODE:-enforce}
    volumes:
      # Read-only: the gateway never writes workspace content. Tool output dirs are
      # created by the runner; tool containers get their own ro suite/shared mounts.
      - ${TRELLIS_WORKSPACE_DIR:-./workspace}:/app/workspace:ro
      - runner-run:/run/trellis
    command: python core/gateway.py
    depends_on:
      host:
        condition: service_started
      hub:
        condition: service_started
      runner:
        condition: service_healthy
    restart: unless-stopped

  etcd:
    # gcr.io is etcd's primary registry (quay.io/coreos/etcd is the secondary).
    # 3.6 keeps the v3 gRPC API used by pyetcd/etcd-sdk-python, so the client is
    # unchanged. In-place upgrade of an existing 3.5 data dir is supported, but
    # it is one-way: once migrated to the 3.6 storage version, rolling back to a
    # 3.5 image requires a snapshot/restore.
    image: gcr.io/etcd-development/etcd:v3.6.15
    container_name: etcd-server
    command: etcd --advertise-client-urls http://etcd:2379 --listen-client-urls http://0.0.0.0:2379 --data-dir /etcd-data
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  taskiq-worker:
    build: *app-build
    image: ${TRELLIS_IMAGE:-ghcr.io/laraibkazi92/trellis-agent-platform:v0.7.1}
    container_name: taskiq-worker
    user: "${TRELLIS_UID:-1000}:${TRELLIS_GID:-1000}"
    # NOTE: no `env_file: .env` here on purpose. A background run resolves only the
    # secrets/variables its workflow declared and hands those to the runner; the
    # worker's own environment is never inherited by anything that runs code. Only
    # the variables the worker actually needs are passed explicitly below.
    environment:
      <<: *common-env
      HOST_URL: http://host:8000
      HUB_URL: http://hub:8001/mcp
      # Framework LLM provider keys (one per provider in the registry) are NOT set here:
      # configure them in the Admin UI -> LLM Providers, stored Fernet-encrypted in etcd.
      REDIS_URL: redis://redis:6379/0
      HINDSIGHT_URL: http://hindsight:8888
      # Decrypts identity-scoped secrets for background agents/scripts.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # The control socket: background agents' tool calls AND background-script
      # workflows execute in runner containers, never in this process.
      RUNNER_SOCKET: ${RUNNER_SOCKET:-/run/trellis/runner.sock}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # Phase 3: the worker mints `svc_agent_<name>` tokens per background run.
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:?set AGENT_TOKEN_SECRET in .env (openssl rand -hex 32)}
      ENFORCE_AGENT_TOKENS: ${ENFORCE_AGENT_TOKENS:-enforce}
      # The ONE tool-authorization switch (v0.7.1): off | shadow | enforce.
      TOOL_ACCESS_MODE: ${TOOL_ACCESS_MODE:-enforce}
      # Env-var default the worker reads for a workflow container's deadline; Admin UI
      # (etcd) overrides still win. Without this pass-through the worker always used the
      # built-in 3600 s and WORKFLOW_RUN_TIMEOUT in .env had no effect.
      WORKFLOW_RUN_TIMEOUT: ${WORKFLOW_RUN_TIMEOUT:-}
    volumes:
      # The workspace is READ-ONLY for the worker since v0.7.1: background scripts run
      # in runner containers, and a background agent's `execute` shell does too. The
      # one exception is `reports/` -- the in-process console file tools
      # (read_file/write_file/edit_file, rooted at reports/<agent> by
      # core/agent_factory.build_agent) still run here.
      - ${TRELLIS_WORKSPACE_DIR:-./workspace}:/app/workspace:ro
      - ${TRELLIS_WORKSPACE_DIR:-./workspace}/reports:/app/workspace/reports:rw
      - runner-run:/run/trellis
    command: taskiq worker core.tasks:broker --workers 2
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
      runner:
        condition: service_healthy
    restart: unless-stopped

  taskiq-scheduler:
    build: *app-build
    image: ${TRELLIS_IMAGE:-ghcr.io/laraibkazi92/trellis-agent-platform:v0.7.1}
    container_name: taskiq-scheduler
    user: "${TRELLIS_UID:-1000}:${TRELLIS_GID:-1000}"
    # NOTE: no `env_file: .env`. The scheduler only enqueues jobs (the worker runs
    # them); it never decrypts secrets and spawns no subprocesses. Its one real
    # requirement, REDIS_URL, is set explicitly below.
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Read-only: the scheduler only enqueues jobs (the worker runs them). It never
      # spawns a subprocess and never decrypts a secret, so it has no reason to write.
      - ${TRELLIS_WORKSPACE_DIR:-./workspace}:/app/workspace:ro
    command: taskiq scheduler core.tasks:scheduler
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
    restart: unless-stopped


  # Agent Memory backend (Hindsight). The standalone image bundles BOTH the API server
  # (port 8888, used by host/taskiq-worker via HINDSIGHT_URL) AND the Control Plane web UI
  # (port 9999, for browsing banks/memories/entity graphs), plus an embedded Postgres
  # (data under /home/hindsight/.pg0). Gated at runtime by the admin 'agent_memory_enabled'
  # feature flag; agents opt in via `agent_memory: true`.
  # Server image tag MUST match requirements.txt's `hindsight-client` version — this is a
  # single monorepo (github.com/vectorize-io/hindsight) that releases the Python client and
  # this server image together under the same version number each release, and consecutive
  # 0.8.x->0.9.x releases include real API-surface changes (e.g. knowledge-base route
  # validation, recall response fields). Previously pinned to 0.8.1-slim against a client
  # pinned to 0.9.1 -- a real 3-minor-version skew, not verified compatible. Confirmed via
  # the GHCR registry (ghcr.io/v2/vectorize-io/hindsight/tags/list) that 0.9.1-slim is a
  # real published tag matching the client pin exactly.
  # Slim variant: no bundled local ML models — relies on the Gemini API for LLM + embeddings.
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.9.1-slim
    container_name: hindsight
    environment:
      TZ: UTC
      # LLM used by Hindsight for fact extraction / reflection. Defaults to Gemini using
      # the framework's GEMINI_API_KEY; override provider/model via .env.
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-gemini}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_LLM_MODEL:-gemini-2.5-flash}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_LLM_API_KEY:-${GEMINI_API_KEY}}
      # Embeddings used for semantic recall. NOTE: the provider value for Gemini/Google
      # embeddings is "google" (the model/key/dim vars below keep the GEMINI_ prefix).
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: ${HINDSIGHT_EMBEDDINGS_PROVIDER:-google}
      HINDSIGHT_API_EMBEDDINGS_GEMINI_MODEL: ${HINDSIGHT_EMBEDDINGS_MODEL:-gemini-embedding-2}
      HINDSIGHT_API_EMBEDDINGS_GEMINI_API_KEY: ${HINDSIGHT_LLM_API_KEY:-${GEMINI_API_KEY}}
      # Output vector size (Matryoshka). Must be set BEFORE storing data — changing it later
      # requires wiping the hindsight-data volume. gemini-embedding-2 supports 128–3072
      # (recommended 768/1536/3072) and auto-normalizes truncated dimensions.
      HINDSIGHT_API_EMBEDDINGS_GEMINI_OUTPUT_DIMENSIONALITY: ${HINDSIGHT_EMBEDDINGS_DIMENSIONS:-768}
      # Reranker. The slim image has no local cross-encoder (no sentence-transformers), so the
      # default 'local' fails. 'rrf' = Reciprocal Rank Fusion passthrough: no neural rerank,
      # no extra model/key/cost — recall still fuses the semantic/BM25/graph/temporal strategies.
      HINDSIGHT_API_RERANKER_PROVIDER: ${HINDSIGHT_RERANKER_PROVIDER:-rrf}
    ports:
      - "${HOST_BIND:-0.0.0.0}:8888:8888"   # API server (used internally by the framework)
      - "${HOST_BIND:-0.0.0.0}:9999:9999"   # Control Plane web UI — browse to http://localhost:9999
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped

  ui:
    build: *app-build
    image: ${TRELLIS_IMAGE:-ghcr.io/laraibkazi92/trellis-agent-platform:v0.7.1}
    container_name: agent-ui
    user: "${TRELLIS_UID:-1000}:${TRELLIS_GID:-1000}"
    env_file:
      - .env
    environment:
      <<: *common-env
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ADMIN_USERS: ${ADMIN_USERS}
      REDIS_URL: redis://redis:6379/0
      # Admin -> Edges "check tunnel" reads the relay's health endpoint.
      EDGE_RELAY_URL: ${EDGE_RELAY_URL:-http://edge-relay:8100}
      # The ONE tool-authorization switch (v0.7.1): off | shadow | enforce. The admin
      # page renders the mode it loaded, so a shell override must reach this process
      # rather than leaving it on the code default.
      TOOL_ACCESS_MODE: ${TOOL_ACCESS_MODE:-enforce}
    volumes:
      - health-data:/app/data
      - ${TRELLIS_WORKSPACE_DIR:-./workspace}:/app/workspace
    command: uvicorn core.ui:app --host 0.0.0.0 --port 8080
    depends_on:
      etcd:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx-gateway:
    build: ./gateway
    container_name: nginx-gateway
    ports:
      - "${HOST_BIND:-0.0.0.0}:80:80"
      - "${HOST_BIND:-0.0.0.0}:443:443"
    environment:
      # Set SSL_ENABLED=True in your .env to enable HTTPS
      - SSL_ENABLED=${SSL_ENABLED:-False}
      - SSL_DNS_NAME=${SSL_DNS_NAME:-localhost}
      # /edge connection-level flood protection (per-site call rates are the relay's).
      - EDGE_RATE_LIMIT_RPS=${EDGE_RATE_LIMIT_RPS:-30}
      - EDGE_RATE_LIMIT_BURST=${EDGE_RATE_LIMIT_BURST:-20}
      # Optional mutual TLS for edge nodes: path to a CA bundle inside the container.
      # Requires SSL_ENABLED=true and the volume below uncommented.
      - EDGE_MTLS_CA=${EDGE_MTLS_CA:-}
    # volumes:
    #   # Map host certificates directory via .env variables:
    #   # Place your cert.pem and key.pem in a directory and map it here
    #   # SSL_CERT_DIR=/path/to/ssl/dir
    #   - ${SSL_CERT_DIR:-./gateway/ssl}:/etc/nginx/ssl:ro
    depends_on:
      ui:
        condition: service_started
      host:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: trellis-network

volumes:
  etcd-data:
  health-data:
  hindsight-data:
  # Runner control socket: written by `runner`, mounted read-write by host, hub,
  # gateway and taskiq-worker. Not a tmpfs -- the socket must outlive a container
  # restart and be visible to every caller.
  runner-run: