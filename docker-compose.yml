services:
  # DB Sync Init Container
  # Runs once at startup to sync agents/tools to etcd
  db-sync:
    build: .
    image: trellis-agent-platform:v2
    container_name: db-sync
    environment:
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    volumes:
      - ./workspace:/app/workspace
      - ./core:/app/core
      - ./scripts:/app/scripts
    command: python scripts/sync_to_db.py
    depends_on:
      etcd:
        condition: service_healthy
    restart: "no"

  # Universal Agent Host (FastAPI + PydanticAI)
  # This is the main entry point for the agent fleet.
  host:
    build: .
    image: trellis-agent-platform:v2
    container_name: agent-host
    env_file:
      - .env
    environment:
      - HOST_URL=http://host:8000
      - HUB_URL=http://hub:8001/mcp
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
      - DEV_MODE=${DEV_MODE:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
    volumes:
      - health-data:/app/data
      - ./workspace:/app/workspace
      - ./core:/app/core
      - ./scripts:/app/scripts
      - ./templates:/app/templates
    command: granian --interface asgi core.host:app --host 0.0.0.0 --port 8000 --workers 4 --workers-max-rss 256 --workers-lifetime 3600
    depends_on:
      hub:
        condition: service_started
      etcd:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
    restart: unless-stopped

  # Polyglot Tool Hub (Internal MCP Server)
  # Executes local polyglot tools and exposes them to the Host via SSE
  hub:
    build: .
    image: trellis-agent-platform:v2
    container_name: tool-hub
    command: python core/hub.py
    restart: unless-stopped
    privileged: true
    depends_on:
      etcd:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
    environment:
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
    volumes:
      - health-data:/app/data
      - ./workspace:/app/workspace
      - ./core:/app/core
      - ./scripts:/app/scripts
      - ./templates:/app/templates

  # External Gateway MCP Server
  # Bridges external MCP clients to the internal agent fleet via the Host's HTTP API.
  gateway:
    build: .
    image: trellis-agent-platform:v2
    container_name: agent-gateway
    environment:
      - HOST_URL=http://host:8000
      - DEV_MODE=${DEV_MODE:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
    volumes:
      - ./workspace:/app/workspace
      - ./core:/app/core
      - ./scripts:/app/scripts
      - ./templates:/app/templates
    command: python core/gateway.py
    depends_on:
      - host
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: etcd-server
    command: etcd --advertise-client-urls http://etcd:2379 --listen-client-urls http://0.0.0.0:2379 --data-dir /etcd-data
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  taskiq-worker:
    build: .
    image: trellis-agent-platform:v2
    container_name: taskiq-worker
    env_file:
      - .env
    environment:
      - HOST_URL=http://host:8000
      - HUB_URL=http://hub:8001/mcp
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
      - DEV_MODE=${DEV_MODE:-false}
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./workspace:/app/workspace
      - ./core:/app/core
      - ./scripts:/app/scripts
      - ./templates:/app/templates
    command: taskiq worker core.tasks:broker --workers 2
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
    restart: unless-stopped

  taskiq-scheduler:
    build: .
    image: trellis-agent-platform:v2
    container_name: taskiq-scheduler
    env_file:
      - .env
    environment:
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./workspace:/app/workspace
      - ./core:/app/core
      - ./scripts:/app/scripts
      - ./templates:/app/templates
    command: taskiq scheduler core.tasks:scheduler
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
    restart: unless-stopped


  ui:
    build: .
    image: trellis-agent-platform:v2
    container_name: agent-ui
    env_file:
      - .env
    environment:
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
      - DEV_MODE=${DEV_MODE:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ADMIN_USERS=${ADMIN_USERS}
    volumes:
      - health-data:/app/data
      - ./workspace:/app/workspace
      - ./core:/app/core
      - ./scripts:/app/scripts
      - ./templates:/app/templates
    command: uvicorn core.ui:app --host 0.0.0.0 --port 8080
    depends_on:
      etcd:
        condition: service_healthy
      db-sync:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx-gateway:
    build: ./gateway
    container_name: nginx-gateway
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set SSL_ENABLED=True in your .env to enable HTTPS
      - SSL_ENABLED=${SSL_ENABLED:-False}
      - SSL_DNS_NAME=${SSL_DNS_NAME:-localhost}
    # volumes:
    #   # Map host certificates directory via .env variables:
    #   # Place your cert.pem and key.pem in a directory and map it here
    #   # SSL_CERT_DIR=/path/to/ssl/dir
    #   - ${SSL_CERT_DIR:-./gateway/ssl}:/etc/nginx/ssl:ro
    depends_on:
      - ui
      - host
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: trellis-network

volumes:
  etcd-data:
  health-data: