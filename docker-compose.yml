version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - agent-network

  web-ui:
    build: ./web-ui
    container_name: web-ui
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-ui.rule=PathPrefix(`/`)"
      - "traefik.http.services.web-ui.loadbalancer.server.port=80"
    environment:
      - PUBLIC_API_URL=http://localhost:8000
      - PUBLIC_API_KEY=${CONTROL_PLANE_API_KEY:-}
    depends_on:
      - control-plane
    networks:
      - agent-network

  control-plane:
    build: ./control-plane
    container_name: control-plane
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-agent_registry}
      - ETCD_ENDPOINT=http://etcd:2379
      - TOOLS_DIR=/app/tools
      - CONTROL_PLANE_API_KEY=${CONTROL_PLANE_API_KEY:-}
    volumes:
      - ./tools:/app/tools
    ports:
      - "8000:8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.control-plane.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.control-plane.middlewares=control-plane-strip"
      - "traefik.http.middlewares.control-plane-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_started
      etcd:
        condition: service_started
    networks:
      - agent-network

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-agent_registry}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    networks:
      - agent-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: etcd
    command: etcd -advertise-client-urls http://0.0.0.0:2379 -listen-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
      - "2380:2380"
    networks:
      - agent-network

  all-tools-mcp-server:
    build: ./all-tools-mcp-server
    container_name: all-tools-mcp-server
    environment:
      - ETCD_ENDPOINT=http://etcd:2379
      - TOOLS_DIR=/app/tools
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-agent_registry}
    volumes:
      - ./tools:/app/tools
    depends_on:
      - etcd
      - postgres
    networks:
      - agent-network

  finance-agent:
    build: ./agents/finance-agent
    container_name: finance-agent-1
    environment:
      - AGENT_NAME=finance-agent
      - REGISTRY_URL=http://control-plane:8000
      - ETCD_ENDPOINT=http://etcd:2379
      - CONTROL_PLANE_API_KEY=${CONTROL_PLANE_API_KEY:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-agent.rule=PathPrefix(`/mcp/finance-agent`)"
      - "traefik.http.services.finance-agent.loadbalancer.server.port=8001"
    depends_on:
      - control-plane
      - etcd
      - all-tools-mcp-server
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
