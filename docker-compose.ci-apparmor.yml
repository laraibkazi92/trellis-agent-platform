#
# CI-only override: run the hub under the shipped `deploy/apparmor/trellis-hub`
# profile instead of `apparmor=unconfined`.
#
# This file exists for exactly one purpose: the `apparmor` job in
# .github/workflows/sandbox-smoke.yml loads the profile on the Ubuntu 24.04
# runner VM (AppArmor enforcing) and then proves the stack still runs under it —
# on bwrap and on the forced Landlock fallback. It is NOT a deployment example;
# production either keeps the base `apparmor=unconfined` or opts into the
# profile by hand (docs/deploy.md).
#
# `security_opt` is a list, and Compose APPENDS override entries to the base
# list. The base hub already has `apparmor=unconfined`, so appending would leave
# two apparmor entries; the `!override` tag (Compose 2.24.4+) replaces the whole
# list instead. The other three options must be repeated here because they still
# apply: bwrap needs systempaths=unconfined and seccomp=unconfined, and
# no-new-privileges stays for every backend.
#
# Verify the merge with:
#   docker compose -f docker-compose.yml -f docker-compose.ci-apparmor.yml config
services:
  hub:
    security_opt: !override
      - "no-new-privileges:true"
      - "systempaths=unconfined"
      - "seccomp=unconfined"
      - "apparmor=trellis-hub"
