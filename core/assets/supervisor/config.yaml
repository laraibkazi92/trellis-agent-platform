name: supervisor
version: 0.1.0
author: markh@acme.com
description: Central router agent for the framework. Resolves deterministic CLI/lookup requests directly via search_tools/use_tool, and delegates complex multi-step investigations to specialized agents via search_agents/task.
tags: ["routing", "orchestration", "direct-tool-execution", "two-tier-dispatch"]
model: gemini-3-flash-preview
thinking_level: medium
# The supervisor is authorized like any other agent: the hub checks every tool it
# executes against this list. Its Tier 1 path runs whatever `search_tools` returns,
# so a supervisor whose deterministic tools are not bound here cannot execute them.
allowed_tools:
  - text_stats
a2a_access:
  - ticket-summary-agent
  - probable-cause-agent
  - troubleshooting-agent
