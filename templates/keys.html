<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Keys</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function toggleKey(id) {
            const el = document.getElementById(id);
            if (el.type === 'password') {
                el.type = 'text';
            } else {
                el.type = 'password';
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-md p-4 flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-gray-800">API Keys</h1>
        <div class="space-x-4">
            <a href="/catalog" class="text-blue-500 hover:underline">Catalog</a>
            <a href="/logout" class="text-red-500 hover:underline">Logout</a>
        </div>
    </nav>

    <div class="container mx-auto p-6 max-w-4xl bg-white rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Your API Keys</h2>
            <form action="/keys/generate" method="POST" class="flex gap-2">
                <input type="text" name="key_name" placeholder="Key Name" required class="border rounded px-3 py-2">
                <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Generate New Key</button>
            </form>
        </div>

        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Key</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                {% for key in keys %}
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ key.name }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <div class="flex items-center gap-2">
                            <input type="password" id="key-{{ loop.index }}" value="{{ key.key }}" readonly class="bg-gray-100 border-none outline-none font-mono">
                            <button onclick="toggleKey('key-{{ loop.index }}')" class="text-blue-500 hover:underline text-xs">Show/Hide</button>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <form action="/keys/revoke" method="POST" class="inline">
                            <input type="hidden" name="api_key" value="{{ key.key }}">
                            <button type="submit" class="text-red-600 hover:text-red-900">Revoke</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="px-6 py-4 text-center text-sm text-gray-500">No API keys found. Generate one above.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
