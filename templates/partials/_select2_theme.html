{# Shared Select2 theme overrides for the <style type="text/tailwindcss"> blocks in
   background_workflows.html and editor.html. Each macro's body begins on the same line as
   its {% macro %} tag so it emits no leading newline at the call site: select2_light() is
   called at the top level of the style block, select2_dark() on the line after the opening
   brace of the prefers-color-scheme media query. background_workflows.html's z-index: 9999
   on .select2-dropdown is harmless on editor.html too. #}
{% macro select2_light() %}        .select2-container--default .select2-selection--multiple,
        .select2-container--default .select2-selection--single {
            background-color: transparent !important;
            border: 1px solid theme('colors.neutral.300') !important;
            border-radius: 0 !important;
            min-height: 46px !important;
            padding-bottom: 0px !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: theme('colors.neutral.900') !important;
            font-family: 'IBM Plex Mono', monospace;
            line-height: 44px !important;
            padding-left: 0.75rem !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 44px !important;
        }
        .select2-container--default.select2-container--focus .select2-selection--multiple,
        .select2-container--default.select2-container--focus .select2-selection--single {
            border-color: theme('colors.accent.DEFAULT') !important;
            box-shadow: 0 0 0 1px theme('colors.accent.DEFAULT');
        }
        .select2-container--default .select2-selection--multiple .select2-selection__choice {
            background-color: theme('colors.neutral.100') !important;
            border: 1px solid theme('colors.neutral.300') !important;
            border-radius: 0 !important;
            color: theme('colors.neutral.900') !important;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            padding: 4px 8px !important;
            margin-top: 6px !important;
            margin-left: 6px !important;
            text-transform: uppercase;
        }
        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
            color: theme('colors.neutral.500') !important;
            border-right: 1px solid theme('colors.neutral.300') !important;
            padding-right: 6px !important;
            margin-right: 6px !important;
        }
        .select2-dropdown {
            border: 1px solid theme('colors.accent.DEFAULT') !important;
            border-radius: 0 !important;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.875rem;
            z-index: 9999;
        }
{%- endmacro %}
{% macro select2_dark() %}            .select2-container--default .select2-selection--multiple,
            .select2-container--default .select2-selection--single {
                border-color: theme('colors.neutral.700') !important;
            }
            .select2-container--default .select2-selection--single .select2-selection__rendered {
                color: theme('colors.neutral.100') !important;
            }
            .select2-container--default.select2-container--focus .select2-selection--multiple,
            .select2-container--default.select2-container--focus .select2-selection--single {
                border-color: theme('colors.accent.dark') !important;
                box-shadow: 0 0 0 1px theme('colors.accent.dark');
            }
            .select2-container--default .select2-selection--multiple .select2-selection__choice {
                background-color: theme('colors.neutral.800') !important;
                border-color: theme('colors.neutral.600') !important;
                color: theme('colors.neutral.100') !important;
            }
            .select2-container--default .select2-selection--multiple .select2-selection__choice__remove {
                color: theme('colors.neutral.400') !important;
                border-right-color: theme('colors.neutral.600') !important;
            }
            .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover {
                background-color: theme('colors.red.900') !important;
                color: theme('colors.red.100') !important;
            }
            .select2-dropdown {
                background-color: theme('colors.neutral.900') !important;
                border-color: theme('colors.neutral.700') !important;
            }
            .select2-container--default .select2-results__option[aria-selected=true] {
                background-color: theme('colors.neutral.800') !important;
            }
            .select2-container--default .select2-results__option--highlighted[aria-selected] {
                background-color: theme('colors.accent.dark') !important;
                color: white !important;
            }
            .select2-search--dropdown .select2-search__field {
                background-color: theme('colors.neutral.950') !important;
                border: 1px solid theme('colors.neutral.700') !important;
                color: theme('colors.neutral.100') !important;
                font-family: 'IBM Plex Mono', monospace;
            }
{%- endmacro %}
