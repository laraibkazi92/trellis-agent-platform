<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ type|capitalize }} - {{ name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-md p-4 flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-gray-800">Edit {{ type|capitalize }}: {{ name }}</h1>
        <div class="space-x-4">
            <a href="/catalog" class="text-blue-500 hover:underline">Back to Catalog</a>
        </div>
    </nav>

    <div class="container mx-auto p-6 max-w-4xl bg-white rounded-lg shadow-md">
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            {{ error }}
        </div>
        {% endif %}
        
        <form action="/editor/{{ type }}/{{ name }}" method="POST">
            {% if type == 'agent' %}
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Model</label>
                    <select name="model" id="modelSelect" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                        <option value="gemini-3.1-pro-preview" {% if config.model == 'gemini-3.1-pro-preview' %}selected{% endif %}>gemini-3.1-pro-preview</option>
                        <option value="gemini-3-flash-preview" {% if config.model == 'gemini-3-flash-preview' %}selected{% endif %}>gemini-3-flash-preview (default)</option>
                        <option value="gemini-3.1-flash-lite-preview" {% if config.model == 'gemini-3.1-flash-lite-preview' %}selected{% endif %}>gemini-3.1-flash-lite-preview</option>
                        <option value="gemini-2.5-flash" {% if config.model == 'gemini-2.5-flash' %}selected{% endif %}>gemini-2.5-flash</option>
                        <option value="gemini-2.5-flash-lite" {% if config.model == 'gemini-2.5-flash-lite' %}selected{% endif %}>gemini-2.5-flash-lite</option>
                        <option value="gemini-2.5-pro" {% if config.model == 'gemini-2.5-pro' %}selected{% endif %}>gemini-2.5-pro</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Thinking Level</label>
                    <select name="thinking_level" id="thinkingLevelSelect" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                        <option value="none" {% if config.thinking_level == 'none' %}selected{% endif %}>None (Disabled)</option>
                        <option value="low" {% if config.thinking_level == 'low' %}selected{% endif %}>Low</option>
                        <option value="medium" {% if config.thinking_level == 'medium' %}selected{% endif %}>Medium</option>
                        <option value="high" {% if config.thinking_level == 'high' %}selected{% endif %}>High</option>
                        <option value="n/a" {% if config.thinking_level == 'n/a' %}selected{% endif %} hidden>N/A</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Version</label>
                    <input type="text" name="version" value="{{ config.version }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                    <input type="text" name="description" value="{{ config.description }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">A2A Access</label>
                    <select name="a2a_access" class="a2a-select mt-1 block w-full rounded-md border-gray-300 shadow-sm" multiple="multiple">
                        {% for agent_name in all_agents %}
                            {% if agent_name != name and agent_name != 'supervisor' %}
                            <option value="{{ agent_name }}" {% if agent_name in config.a2a_access %}selected{% endif %}>{{ agent_name }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Allowed MCP Tools</label>
                    <input type="text" id="toolSearch" placeholder="Search tools..." class="mb-2 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                    <div class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-4 max-h-60 overflow-y-auto bg-gray-50" id="toolList">
                        {% for tool_name in all_tools %}
                        <div class="flex items-center mb-2 tool-item">
                            <input id="tool_{{ tool_name }}" name="allowed_tools" value="{{ tool_name }}" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" {% if tool_name in config.get('allowed_tools', []) %}checked{% endif %}>
                            <label for="tool_{{ tool_name }}" class="ml-2 block text-sm text-gray-900 tool-name-label">
                                {{ tool_name }}
                            </label>
                        </div>
                        {% else %}
                        <div class="text-sm text-gray-500 italic">No tools registered.</div>
                        {% endfor %}
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Skills (Markdown)</label>
                    <textarea name="skills_content" rows="15" class="shadow-sm focus:ring-blue-500 focus:border-blue-500 mt-1 block w-full sm:text-sm border border-gray-300 rounded-md p-2 font-mono">{{ skills_content }}</textarea>
                </div>
            {% elif type == 'tool' %}
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Runtime</label>
                    <select name="runtime" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                        <option value="python" {% if config.runtime == 'python' %}selected{% endif %}>Python</option>
                        <option value="go" {% if config.runtime == 'go' %}selected{% endif %}>Go</option>
                        <option value="ts" {% if config.runtime == 'ts' %}selected{% endif %}>TypeScript</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Version</label>
                    <input type="text" name="version" value="{{ config.version }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                    <input type="text" name="description" value="{{ config.description }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Entrypoint</label>
                    <input type="text" name="entrypoint" value="{{ config.entrypoint }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>
                <input type="hidden" name="rel_path" value="{{ config.rel_path }}">
            {% endif %}
            <div class="flex justify-end">
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Save Changes & Commit</button>
            </div>
        </form>
    </div>
    <script>
        $(document).ready(function() {
            $('.a2a-select').select2({
                placeholder: "Select agents for A2A access"
            });
            $('#toolSearch').on('input', function() {
                var searchTerm = $(this).val().toLowerCase();
                $('.tool-item').each(function() {
                    var toolName = $(this).find('.tool-name-label').text().toLowerCase();
                    if (toolName.indexOf(searchTerm) > -1) {
                        $(this).show();
                    } else {
                        $(this).hide();
                    }
                });
            });

            // Logic for Thinking Level based on selected model
            function updateThinkingLevel() {
                var selectedModel = $('#modelSelect').val();
                var $thinkingSelect = $('#thinkingLevelSelect');
                var $noneOption = $thinkingSelect.find('option[value="none"]');
                var $naOption = $thinkingSelect.find('option[value="n/a"]');
                var currentVal = $thinkingSelect.val();

                // Reset states
                $thinkingSelect.prop('disabled', false);
                $thinkingSelect.find('option').show();
                $noneOption.prop('disabled', false);
                
                if (!selectedModel) return;

                if (selectedModel.includes('lite')) {
                    // Lite models don't support thinking
                    $thinkingSelect.prop('disabled', true);
                    $thinkingSelect.val('n/a');
                } else if (selectedModel === 'gemini-2.5-pro') {
                    // 2.5 Pro requires thinking, 'none' not allowed
                    $noneOption.hide();
                    $noneOption.prop('disabled', true);
                    $naOption.hide();
                    if (currentVal === 'none' || currentVal === 'n/a') {
                        $thinkingSelect.val('low'); // fallback to low
                    }
                } else {
                    // 2.5 Flash and 3.x support 'none'
                    $naOption.hide();
                    if (currentVal === 'n/a') {
                        $thinkingSelect.val('none'); // fallback to none
                    }
                }
            }

            $('#modelSelect').on('change', updateThinkingLevel);
            updateThinkingLevel(); // Run on init
        });
    </script>
</body>
</html>
