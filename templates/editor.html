<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Skills - {{ agent_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-md p-4 flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-gray-800">Edit Skills: {{ agent_name }}</h1>
        <div class="space-x-4">
            <a href="/catalog" class="text-blue-500 hover:underline">Back to Catalog</a>
        </div>
    </nav>

    <div class="container mx-auto p-6 max-w-4xl bg-white rounded-lg shadow-md">
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            {{ error }}
        </div>
        {% endif %}
        
        <form action="/editor/{{ agent_name }}" method="POST">
            <div class="mb-4">
                <label for="skills_content" class="block text-sm font-medium text-gray-700 mb-2">Skills (Markdown)</label>
                <textarea id="skills_content" name="skills_content" rows="20" class="shadow-sm focus:ring-blue-500 focus:border-blue-500 mt-1 block w-full sm:text-sm border border-gray-300 rounded-md p-2 font-mono">{{ skills_content }}</textarea>
            </div>
            <div class="flex justify-end">
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Save Changes</button>
            </div>
        </form>
    </div>
</body>
</html>
