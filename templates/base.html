<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Marketplace{% endblock %} - Agent Framework</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Syne', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                    colors: {
                        accent: { DEFAULT: '#0055FF', dark: '#3377FF' }
                    }
                }
            }
        }

        function copyToClipboard(button, textSelector) {
            const container = button.closest('.group');
            const targetElement = container.querySelector(textSelector);
            const textToCopy = targetElement.textContent || targetElement.innerText;
            
            navigator.clipboard.writeText(textToCopy.trim()).then(() => {
                const originalText = button.innerText;
                button.innerText = 'COPIED!';
                button.classList.add('!text-green-500', '!border-green-500');
                
                setTimeout(() => {
                    button.innerText = originalText;
                    button.classList.remove('!text-green-500', '!border-green-500');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                button.innerText = 'ERROR';
                setTimeout(() => {
                    button.innerText = 'COPY';
                }, 2000);
            });
        }
    </script>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-50 min-h-screen antialiased selection:bg-accent selection:text-white dark:selection:bg-accent-dark flex flex-col">
    <nav class="border-b border-neutral-200 dark:border-neutral-800 p-4 px-6 flex flex-wrap gap-4 justify-between items-center bg-white dark:bg-neutral-900 sticky top-0 z-40">
        <a href="/" class="text-xl font-bold tracking-tight uppercase hover:text-accent dark:hover:text-accent-dark transition-colors">Agent Framework</a>
        <div class="space-x-4 md:space-x-6 text-sm font-bold font-mono tracking-wide flex items-center flex-wrap">
            <a href="/agents" class="hover:text-accent dark:hover:text-accent-dark transition-colors uppercase {% if request.url.path == '/agents' %}text-accent dark:text-accent-dark{% endif %}">Agents</a>
            <a href="/tools" class="hover:text-accent dark:hover:text-accent-dark transition-colors uppercase {% if request.url.path == '/tools' %}text-accent dark:text-accent-dark{% endif %}">Tools</a>
            <span class="text-neutral-300 dark:text-neutral-700 hidden sm:inline">|</span>
            {% if user %}
            <span class="text-neutral-500 dark:text-neutral-400 hidden sm:inline">USER:{{ user.name }}</span>
            <a href="/keys" class="hover:text-accent dark:hover:text-accent-dark transition-colors uppercase {% if request.url.path == '/keys' %}text-accent dark:text-accent-dark{% endif %}">API Keys</a>
            <a href="/secrets" class="hover:text-accent dark:hover:text-accent-dark transition-colors uppercase {% if request.url.path == '/secrets' %}text-accent dark:text-accent-dark{% endif %}">Secrets</a>
            <a href="/logout" class="text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 transition-colors uppercase">Logout</a>
            {% else %}
            <a href="/login" class="hover:text-accent dark:hover:text-accent-dark transition-colors uppercase">Login</a>
            {% endif %}
        </div>
    </nav>

    <main class="flex-grow container mx-auto p-4 md:p-6 max-w-7xl mt-4 md:mt-8">
        {% if flash_msg %}
        <div id="flash-toast" class="flex justify-between items-center border border-accent text-accent dark:border-accent-dark dark:text-accent-dark px-4 py-3 mb-8 font-mono text-sm uppercase tracking-wide bg-accent/5 dark:bg-accent-dark/10 transition-opacity duration-500">
            <span>> {{ flash_msg }}</span>
            <button onclick="document.getElementById('flash-toast').remove()" class="text-accent hover:text-accent-dark dark:text-accent-dark dark:hover:text-accent transition-colors">
                [X]
            </button>
        </div>
        <script>
            setTimeout(() => {
                const toast = document.getElementById('flash-toast');
                if (toast) {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 500); // Wait for transition
                }
            }, 3000);
        </script>
        {% endif %}
        
        {% block content %}{% endblock %}
    </main>
    
    <footer class="border-t border-neutral-200 dark:border-neutral-800 py-6 text-center text-sm font-mono text-neutral-500 mt-12 bg-white dark:bg-neutral-900">
        Trellis Agent Platform
    </footer>
</body>
</html>
