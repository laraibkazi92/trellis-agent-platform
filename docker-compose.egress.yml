# Egress mode for the tool hub (opt-in). DO NOT auto-load this file: it is not
# docker-compose.override.yml, so a plain `docker compose up -d` is unchanged.
#
# Enable it by putting this in .env (or the shell):
#
#     COMPOSE_FILE=docker-compose.yml:docker-compose.egress.yml
#
# WHAT IT DOES
#   * adds `toolnet`, an `internal: true` network with no external route;
#   * moves the hub to `toolnet` ONLY, so tools (which share the hub's netns)
#     have no route off the host except the proxy;
#   * attaches etcd/redis (already listening on 0.0.0.0) and the services that
#     call the hub (host, gateway, taskiq-worker) to `toolnet` as well;
#   * adds `egress-proxy`, the only container on both networks, running
#     scripts/egress_proxy.py with an allowlist generated from tool.yaml;
#   * points the hub -- and therefore every tool it spawns -- at that proxy;
#   * forwards every documented EGRESS_* knob below, so setting one in .env
#     actually reaches the proxy instead of silently doing nothing;
#   * gates the hub on the proxy's healthcheck, so a dead proxy (bad ACL, bind
#     failure) fails `docker compose up --wait` instead of leaving the stack
#     "up" with no egress path.
#
# CAVEAT: a committed override file is NOT picked up automatically. Any later
# plain `docker compose up -d` silently drops the override and puts the hub back
# on the default network with unrestricted egress. Keep COMPOSE_FILE in .env, or
# pass -f docker-compose.yml -f docker-compose.egress.yml every time.
#
# `!override` requires Compose 2.24.4+. Compose merges `networks` by key, so
# declaring `networks: [toolnet]` without it would leave `default` attached and
# the hub would keep its route to the internet.
#
# The proxy needs a writable directory for the generated allowlist; /run/egress
# is a small tmpfs because the container runs as TRELLIS_UID, not root.
services:
  hub:
    # The one service that must lose the default network.
    networks: !override
      - toolnet
    # Merged into the hub's existing depends_on map (etcd, db-sync): the hub
    # must not start -- and `docker compose up --wait` must not report success
    # -- while the proxy is dead or its ACL failed to generate.
    depends_on:
      egress-proxy:
        condition: service_healthy
    environment:
      # Every URL uses EGRESS_LISTEN_PORT, the same knob the proxy binds and its
      # healthcheck probes. Change the port in one place only.
      HTTP_PROXY: http://egress-proxy:${EGRESS_LISTEN_PORT:-3128}
      HTTPS_PROXY: http://egress-proxy:${EGRESS_LISTEN_PORT:-3128}
      http_proxy: http://egress-proxy:${EGRESS_LISTEN_PORT:-3128}
      https_proxy: http://egress-proxy:${EGRESS_LISTEN_PORT:-3128}
      # Load-bearing: tools call the framework API at http://host:8000 and the
      # hub talks to etcd. Without this, those calls would be sent to the proxy.
      NO_PROXY: etcd,redis,host,hub,gateway,taskiq-worker,localhost,127.0.0.1,::1
      no_proxy: etcd,redis,host,hub,gateway,taskiq-worker,localhost,127.0.0.1,::1

  # Everything below already reaches the hub by service name; it needs toolnet
  # because the hub is no longer on the default network.
  host:
    networks:
      - default
      - toolnet

  gateway:
    networks:
      - default
      - toolnet

  taskiq-worker:
    networks:
      - default
      - toolnet

  # etcd/redis listen on 0.0.0.0 already. Keep default for ui/nginx/db-sync and
  # add toolnet so the hub (and its tools) can reach them. This is why egress
  # mode does not isolate tools from etcd/redis -- see docs/deploy.md.
  etcd:
    networks:
      - default
      - toolnet

  redis:
    networks:
      - default
      - toolnet

  egress-proxy:
    build:
      context: .
      args:
        PUID: ${TRELLIS_UID:-1000}
        PGID: ${TRELLIS_GID:-1000}
    image: ${TRELLIS_IMAGE:-ghcr.io/laraibkazi92/trellis-agent-platform:v0.5.1}
    container_name: egress-proxy
    user: "${TRELLIS_UID:-1000}:${TRELLIS_GID:-1000}"
    init: true
    # Generate the allowlist from the read-only workspace, then become the
    # proxy. Generation is fail-closed: an invalid `egress:` entry stops the
    # container (and therefore denies all egress) instead of guessing.
    command:
      - bash
      - -c
      - |
        # `$$` is compose's escape for a literal `$`; bash expands the container env.
        python scripts/generate_egress_acl.py \
          --workspace /app/workspace \
          --out "$${EGRESS_ALLOWLIST_FILE}" &&
        exec python scripts/egress_proxy.py
    environment:
      # Path inside the tmpfs below; the generator writes here and the proxy
      # reads it (the command expands $${EGRESS_ALLOWLIST_FILE}). Override only
      # if you also give the container a writable mount at the new path.
      EGRESS_ALLOWLIST_FILE: ${EGRESS_ALLOWLIST_FILE:-/run/egress/allowlist}
      # Every documented EGRESS_* knob is forwarded here. Without these lines
      # compose would hand the proxy only the allowlist path, and an operator
      # setting them in .env would silently change nothing.
      EGRESS_LISTEN_PORT: ${EGRESS_LISTEN_PORT:-3128}
      EGRESS_PORTS: ${EGRESS_PORTS:-443}
      EGRESS_ALLOW_PRIVATE_DESTINATIONS: ${EGRESS_ALLOW_PRIVATE_DESTINATIONS:-false}
      EGRESS_CONNECT_TIMEOUT: ${EGRESS_CONNECT_TIMEOUT:-10}
      EGRESS_IDLE_TIMEOUT: ${EGRESS_IDLE_TIMEOUT:-60}
      EGRESS_MAX_TUNNEL_S: ${EGRESS_MAX_TUNNEL_S:-600}
      EGRESS_MAX_CONNECTIONS: ${EGRESS_MAX_CONNECTIONS:-64}
    volumes:
      - ${TRELLIS_WORKSPACE_DIR:-./workspace}:/app/workspace:ro
    tmpfs:
      - /run/egress:mode=1777,size=1m
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    # No published ports: only toolnet (and default, for outbound internet).
    networks:
      - toolnet
      - default
    healthcheck:
      # TCP connect to the listener it actually bound (EGRESS_LISTEN_PORT), so
      # a proxy that crashed, exited on a bad ACL, or never bound is unhealthy
      # rather than merely "started".
      test:
        - CMD-SHELL
        - python -c "import socket; socket.create_connection(('127.0.0.1', ${EGRESS_LISTEN_PORT:-3128}), 2).close()"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # An ACL/config error exits 2 and would otherwise crash-loop forever. Three
    # attempts, then Docker leaves the container down; with the hub's
    # depends_on: service_healthy and this healthcheck, `docker compose
    # up --wait` then fails instead of reporting a healthy stack with no egress
    # path. Restarting is still worth it for a transient port bind race.
    restart: "on-failure:3"

networks:
  # `internal: true` removes the default route from this network. TCP and UDP
  # therefore cannot leave, but DNS is a residual channel: the embedded resolver
  # forwards external lookups from the host stack (query names can carry data).
  # See the egress section of docs/deploy.md.
  toolnet:
    internal: true
