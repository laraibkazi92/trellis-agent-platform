# TLS terminator for the edge tunnel ONLY -- see deploy/tls/README.md.
#
# It exists so an install can keep plain HTTP on :80 (agents, MCP clients,
# bookmarks) while edges still get an encrypted path. Only /edge is proxied; the
# rest of the surface stays where it is.
#
# Mounted at /etc/nginx/conf.d/default.conf, replacing the image's default file.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # The relay caps a frame at 10 MB; 12m leaves headroom.
    client_max_body_size 12m;

    # Liveness for the compose healthcheck. Deliberately unauthenticated and
    # independent of the inner nginx: it answers "is TLS up?".
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /edge {
        # Same pattern as the main entrypoint: resolve at request time so this
        # proxy can start before nginx-gateway exists on the network.
        resolver 127.0.0.11 valid=30s;
        set $edge_upstream http://nginx-gateway:80;
        proxy_pass $edge_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Long-lived tunnel: never buffer, never time out mid-session.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Nothing else is reachable through the edge listener.
    location / {
        return 404;
    }
}
