# Optional TLS terminator for the edge tunnel only -- see deploy/tls/README.md
# and docs/proxy-tls.md.
#
# Use it when the install must keep plain HTTP on :80 (agents, MCP clients,
# bookmarks) but edges still need an encrypted path. It publishes
# ${EDGE_TLS_PORT:-8443} and forwards /edge to the ordinary nginx; nothing else
# about the stack changes.
#
# Run it without editing the main compose file:
#
#   docker compose -f docker-compose.yml -f deploy/tls/docker-compose.edge-tls.yml \
#     up -d edge-tls
#
# Make it permanent by copying this file to docker-compose.override.yml at the
# repository root (paths below resolve from the project directory).
services:
  edge-tls:
    image: nginx:alpine
    container_name: edge-tls
    # 8443 by default: 443 belongs to nginx-gateway. Point edges at this port
    # (wss://<host>:8443/edge/v1/connect) or move the published port with
    # EDGE_TLS_PORT if 443 is free.
    ports:
      - "${HOST_BIND:-0.0.0.0}:${EDGE_TLS_PORT:-8443}:8443"
    environment:
      # Nothing to configure: the certificate paths are fixed in the conf and
      # the upstream is resolved per request.
      TZ: ${TZ:-UTC}
    volumes:
      # cert.pem + key.pem. Default matches the main stack's cert directory, so
      # one certificate can serve both listeners.
      - ${TLS_CERT_DIR:-./gateway/ssl}:/etc/nginx/ssl:ro
      - ./deploy/tls/edge-tls.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nginx-gateway:
        condition: service_started
    healthcheck:
      # TLS-level liveness, independent of the inner nginx.
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:8443/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
