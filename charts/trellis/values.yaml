# ==============================================================================
# Trellis starter chart values
#
# Mirrors docker-compose.yml (the deployment source of truth) — see the compose
# file for the command lines, ports, and env wiring this chart replicates.
# etcd, Redis, and Hindsight are expected to be provided EXTERNALLY (existing
# services or your own subchart wiring) — see charts/trellis/README.md.
# ==============================================================================

# App image: built from the repo root Dockerfile; shared by host/hub/ui/mcp-gateway.
# `trellis-agent-platform:v2` mirrors docker-compose.yml. When publishing to a
# registry (scripts/publish_images.sh), point repository/tag at your registry.
image:
  repository: trellis-agent-platform
  tag: "v2"
  pullPolicy: IfNotPresent

# Edge gateway image: docker-compose builds ./gateway, whose Dockerfile is
# `FROM nginx:alpine` and only ships entrypoint.sh (mounted here via ConfigMap).
gatewayImage:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service ports (container and service ports match — see docker-compose.yml).
services:
  host: 8000      # Universal Agent Host (core/host.py)
  hub: 8001       # Polyglot Tool Hub (core/hub.py)
  ui: 8080        # Dashboard UI (core/ui.py)
  mcpGateway: 8002  # External MCP gateway (core/gateway.py) — cluster-internal
  gateway: 80     # nginx edge (gateway/) — the chart's front door

# Non-secret configuration → rendered into the <release>-env ConfigMap.
config:
  devMode: "false"
  tz: UTC
  corsAllowedOrigins: ""
  adminUsers: ""
  publicHostUrl: "http://localhost:8000"
  publicMcpUrl: "http://localhost/mcp"

# Secret configuration → rendered into the <release> Secret (stringData).
# sessionSecret ships EMPTY on purpose — an explicit value must be provided for
# every real deployment (outside DEV_MODE the app refuses to start without
# SESSION_SECRET; ENCRYPTION_KEY falls back to it when unset). Empty values
# omit the key.
secrets:
  sessionSecret: ""
  encryptionKey: ""

# External stateful dependencies, provided outside this chart (existing
# services in the namespace, or subcharts you add yourself — see README.md).
externalDependencies:
  etcd:
    host: etcd
    port: 2379
  redis:
    host: redis
    port: 6379
    # Optional full URL override (wins over host/port), e.g. redis://redis:6379/0
    url: ""
  hindsight:
    url: http://hindsight:8888

# Run `python scripts/sync_to_db.py` as an init container on the host
# deployment — the Helm equivalent of compose's one-shot `db-sync` service.
syncInit:
  enabled: true

# Optional: name of an existing PVC holding your workspace/ content (agents,
# tools, workflows). The app image does NOT bake workspace/ in (compose
# bind-mounts it), so provide one for anything beyond the baked-in defaults.
workspace:
  persistentVolumeClaim: ""

# nginx edge (gateway/) options.
gateway:
  sslEnabled: "False"
  sslDnsName: localhost
  # DNS resolver nginx uses for runtime upstream resolution. 127.0.0.11 in the
  # compose entrypoint is Docker's embedded DNS; in Kubernetes use kube-dns.
  dnsResolver: kube-dns.kube-system.svc.cluster.local

ingress:
  enabled: false
  className: ""
  annotations: {}
  # hosts:
  #   - trellis.example.com
  hosts: []
  tls: []
  #  - secretName: trellis-tls
  #    hosts:
  #      - trellis.example.com

# Resource requests/limits applied to every deployment (app pods and gateway).
resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi
