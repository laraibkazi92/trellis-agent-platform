{{- $component := "gateway" }}
{{/*
  nginx edge gateway — the Kubernetes counterpart of compose's `nginx-gateway`
  service (built from ./gateway). The image is plain nginx:alpine (the
  gateway/ Dockerfile only adds entrypoint.sh); the entrypoint is supplied
  here via ConfigMap instead of a custom image build.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trellis.fullname" . }}-{{ $component }}
  labels:
    {{- include "trellis.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trellis.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trellis.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.gatewayImage.repository }}:{{ .Values.gatewayImage.tag }}"
          imagePullPolicy: {{ .Values.gatewayImage.pullPolicy }}
          # The compose gateway/ image runs /entrypoint.sh; here the same
          # script is mounted from a ConfigMap (see configmap-gateway-entrypoint).
          command: ["/bin/sh", "/gateway-config/entrypoint.sh"]
          ports:
            - name: http
              containerPort: {{ .Values.services.gateway }}
              protocol: TCP
          env:
            - name: SSL_ENABLED
              value: {{ .Values.gateway.sslEnabled | quote }}
            - name: SSL_DNS_NAME
              value: {{ .Values.gateway.sslDnsName | quote }}
          # Mirrors the compose healthcheck (wget -qO- http://127.0.0.1/).
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: gateway-entrypoint
              mountPath: /gateway-config
      volumes:
        - name: gateway-entrypoint
          configMap:
            name: {{ include "trellis.fullname" . }}-gateway-entrypoint
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trellis.fullname" . }}-{{ $component }}
  labels:
    {{- include "trellis.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.services.gateway }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "trellis.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
