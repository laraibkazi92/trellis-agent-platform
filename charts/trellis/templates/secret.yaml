{{- $s := .Values.secrets }}
{{- if or $s.sessionSecret $s.encryptionKey $s.geminiApiKey $s.openaiApiKey $s.anthropicApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trellis.fullname" . }}
  labels:
    {{- include "trellis.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with $s.sessionSecret }}
  SESSION_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $s.encryptionKey }}
  ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.geminiApiKey }}
  GEMINI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
