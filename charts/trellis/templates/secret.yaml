{{- $s := .Values.secrets }}
{{- if or $s.sessionSecret $s.encryptionKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trellis.fullname" . }}
  labels:
    {{- include "trellis.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with $s.sessionSecret }}
  SESSION_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $s.encryptionKey }}
  ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
