{{- $component := "ui" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trellis.fullname" . }}-{{ $component }}
  labels:
    {{- include "trellis.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trellis.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trellis.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Mirrors docker-compose.yml (ui.command).
          command:
            - uvicorn
            - core.ui:app
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.services.ui }}"
          ports:
            - name: http
              containerPort: {{ .Values.services.ui }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "trellis.fullname" . }}-env
            - secretRef:
                name: {{ include "trellis.fullname" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "trellis.workspaceVolumeMount" (dict "ctx" .) | nindent 12 }}
      volumes:
        {{- include "trellis.workspaceVolume" (dict "ctx" .) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trellis.fullname" . }}-{{ $component }}
  labels:
    {{- include "trellis.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.services.ui }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "trellis.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
