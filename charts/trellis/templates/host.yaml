{{- $component := "host" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trellis.fullname" . }}-{{ $component }}
  labels:
    {{- include "trellis.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trellis.selectorLabels" (dict "ctx" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trellis.selectorLabels" (dict "ctx" . "component" $component) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.syncInit.enabled }}
      # Helm equivalent of compose's one-shot `db-sync` service
      # (depends_on: service_completed_successfully).
      initContainers:
        - name: db-sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "scripts/sync_to_db.py"]
          envFrom:
            - configMapRef:
                name: {{ include "trellis.fullname" . }}-env
            - secretRef:
                name: {{ include "trellis.fullname" . }}
          volumeMounts:
            {{- include "trellis.workspaceVolumeMount" (dict "ctx" .) | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Mirrors docker-compose.yml (host.command).
          command:
            - granian
            - --interface
            - asgi
            - core.host:app
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.services.host }}"
            - --workers
            - "2"
            - --runtime-threads
            - "1"
            - --workers-max-rss
            - "256"
            - --workers-lifetime
            - "3600"
          ports:
            - name: http
              containerPort: {{ .Values.services.host }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "trellis.fullname" . }}-env
            - secretRef:
                name: {{ include "trellis.fullname" . }}
          # Framework LLM provider keys are configured in the Admin UI -> LLM Providers
          # (stored Fernet-encrypted in etcd), not injected via env here.
          # Mirrors the compose healthcheck (curl -sf http://127.0.0.1:8000/health).
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "trellis.workspaceVolumeMount" (dict "ctx" .) | nindent 12 }}
      volumes:
        {{- include "trellis.workspaceVolume" (dict "ctx" .) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trellis.fullname" . }}-{{ $component }}
  labels:
    {{- include "trellis.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.services.host }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "trellis.selectorLabels" (dict "ctx" . "component" $component) | nindent 4 }}
