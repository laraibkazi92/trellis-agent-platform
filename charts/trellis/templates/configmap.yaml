apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trellis.fullname" . }}-env
  labels:
    {{- include "trellis.labels" . | nindent 4 }}
data:
  ETCD_HOST: {{ .Values.externalDependencies.etcd.host | quote }}
  ETCD_PORT: {{ .Values.externalDependencies.etcd.port | quote }}
  {{- if .Values.externalDependencies.redis.url }}
  REDIS_URL: {{ .Values.externalDependencies.redis.url | quote }}
  {{- else }}
  REDIS_URL: {{ printf "redis://%s:%v/0" .Values.externalDependencies.redis.host .Values.externalDependencies.redis.port | quote }}
  {{- end }}
  HINDSIGHT_URL: {{ .Values.externalDependencies.hindsight.url | quote }}
  DEV_MODE: {{ .Values.config.devMode | quote }}
  HOST_BIND: {{ .Values.config.hostBind | quote }}
  TZ: {{ .Values.config.tz | quote }}
  HOST_URL: {{ printf "http://%s-host:%v" (include "trellis.fullname" .) .Values.services.host | quote }}
  HUB_URL: {{ printf "http://%s-hub:%v/mcp" (include "trellis.fullname" .) .Values.services.hub | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  ADMIN_USERS: {{ .Values.config.adminUsers | quote }}
  PUBLIC_HOST_URL: {{ .Values.config.publicHostUrl | quote }}
  PUBLIC_MCP_URL: {{ .Values.config.publicMcpUrl | quote }}
