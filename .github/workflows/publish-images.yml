# Publishes the Trellis engine image to GHCR as a multi-arch (linux/amd64 + linux/arm64)
# image, so orgs can `docker compose pull` instead of building the whole toolchain
# (Python + Node + Go) themselves. See docs/deploy.md.
#
# Triggers:
#   - push of a v* tag (the normal release path): publishes
#     ghcr.io/<owner>/<repo>:<tag>, plus :latest for stable tags (no "-" suffix;
#     pre-releases like v0.2.0-rc1 do not move :latest)
#   - workflow_dispatch with an explicit tag (for re-publishing / testing the workflow
#     before the first real release)
#
# No secrets to configure: GITHUB_TOKEN with packages:write is sufficient. NOTE: GHCR
# packages default to PRIVATE even for a public repo -- set the package visibility to
# public after the first push, or orgs must authenticate (docker login ghcr.io) to pull.
name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and tags
        id: meta
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          # `${VAR:-default}` picks the dispatch input when present, else the pushed tag.
          version="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          # GHCR requires a lowercase repository path.
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$version"
            echo "image=$image"
            echo "tags<<TAGS"
            echo "${image}:${version}"
            # Advance :latest only for stable releases (skip pre-release suffixes like -rc1).
            if [[ "$version" != *-* ]]; then
              echo "${image}:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${image}:${version}"

      # QEMU lets buildx build the non-native architecture on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            TRELLIS_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
