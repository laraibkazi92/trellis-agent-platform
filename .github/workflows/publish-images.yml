#
# Publishes the Trellis engine image to GHCR as a multi-arch (linux/amd64 + linux/arm64)
# image, so orgs can `docker compose pull` instead of building the whole toolchain
# (Python + Node + Go) themselves. See docs/deploy.md.
#
# Triggers:
#   - push of a v* tag (the normal release path)
#   - workflow_dispatch against a TAG ref, to re-publish an existing release. A
#     dispatch against a branch fails the ref guard below and publishes nothing.
#   The version always comes from the git ref, never from a workflow input, so a
#   published image cannot disagree with the commit its tag points at.
#
# Tags: `<version>` always, plus `:latest` for stable versions (anything without a
# "-" suffix, so v0.2.0-rc1 does not move :latest).
#
# Provenance: the image is attested by GitHub's keyless signer, bound to this repo,
# this workflow file, and the tag ref. Verify a pulled image with
#   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> -R <owner>/<repo>
#
# Publishing is gated by the `release` environment (repo settings -> Environments),
# whose required reviewers must approve before any step runs -- so the
# packages:write and id-token:write tokens are not minted until a human approves.
# It is also gated on CI: every workflow that ran for the tagged commit must have
# succeeded, so a tag cannot ship code whose tests failed.
#
# No secrets to configure: GITHUB_TOKEN with packages:write is sufficient. NOTE: GHCR
# packages default to PRIVATE even for a public repo -- set the package visibility to
# public after the first push, or orgs must authenticate (docker login ghcr.io) to pull.
name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io

# The tag is the unit of deployment: a re-run against a tag that is still
# publishing must not interleave with the run already in flight.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the annotated tag object is present for the guard below.
          fetch-depth: 0

      - name: "Guard: only a tag ref may publish"
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "publishing requires a tag ref; got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [[ "$head_sha" != "$tag_sha" ]]; then
            echo "${GITHUB_REF_NAME} points at ${tag_sha}, but ${head_sha} is checked out" >&2
            exit 1
          fi

      # A tag push reaches this workflow directly, bypassing CI -- v0.3.0 and v0.4.0
      # both published images from commits whose test suite was failing. Refuse to
      # build unless every workflow that ran for this commit succeeded.
      #
      # The run list includes THIS run, which is in progress by definition; counting it
      # would leave `pending` above zero until the timeout and fail every release. It is
      # filtered out first, so the gate only judges the other workflows for the commit.
      - name: Require green CI for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          TIMEOUT_SECONDS: "900"
        run: |
          deadline=$(( SECONDS + TIMEOUT_SECONDS ))
          saw_any=false
          while :; do
            runs=$(gh run list --commit "$SHA" --limit 50 \
                     --json databaseId,workflowName,status,conclusion)
            runs=$(jq -c --arg run "$RUN_ID" \
                     '[.[] | select((.databaseId|tostring) != $run)]' <<<"$runs")
            if [[ "$runs" != "[]" ]]; then
              saw_any=true
            fi

            # Path-filtered and schedule-only workflows show up as skipped/neutral.
            failed=$(jq -r '[.[] | select(.status == "completed")
                              | select(.conclusion != "success"
                                       and .conclusion != "skipped"
                                       and .conclusion != "neutral")]
                             | unique_by(.workflowName)
                             | .[] | "\(.workflowName): \(.conclusion)"' <<<"$runs")
            if [[ -n "$failed" ]]; then
              echo "::error::CI is not green for ${SHA}; refusing to publish"
              printf '  %s\n' "$failed"
              exit 1
            fi

            # Require a completed, successful CI run: a commit that never ran the
            # test suite is not a releasable commit.
            ci_ok=$(jq '[.[] | select(.workflowName == "CI" and .status == "completed"
                                       and .conclusion == "success")] | length' <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            if [[ "$ci_ok" -gt 0 && "$pending" -eq 0 ]]; then
              echo "CI green for ${SHA}; publishing"
              exit 0
            fi

            if [[ "$SECONDS" -gt "$deadline" ]]; then
              if [[ "$saw_any" == false ]]; then
                echo "::error::no CI run found for ${SHA}; tag only a commit that ran CI on main"
              else
                echo "::error::timed out waiting for CI on ${SHA} (${pending} run(s) still in progress)"
              fi
              exit 1
            fi
            echo "waiting for CI on ${SHA} (${pending} run(s) in progress)"
            sleep 20
          done

      - name: Resolve image name and tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME}"
          # GHCR requires a lowercase repository path.
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$version"
            echo "image=$image"
            echo "tags<<TAGS"
            echo "${image}:${version}"
            # Advance :latest only for stable releases (skip pre-release suffixes like -rc1).
            if [[ "$version" != *-* ]]; then
              echo "${image}:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing ${image}:${version}"

      # QEMU lets buildx build the non-native architecture on the amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The attestation step below is the signed provenance statement; buildx's
          # own (unsigned) one would duplicate it.
          provenance: false
          build-args: |
            TRELLIS_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # Store the attestation next to the image so verification needs no
          # GitHub API call beyond `gh`'s own auth.
          push-to-registry: true

      - name: Record the published digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published ${IMAGE}:${GITHUB_REF_NAME}"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Verify: \`gh attestation verify oci://${IMAGE}:${GITHUB_REF_NAME} -R ${GITHUB_REPOSITORY}\`"
          } >> "$GITHUB_STEP_SUMMARY"
