#
# Sandbox smoke: the container execution contract, end to end, on a GitHub-hosted runner.
#
# What this proves (one leg, one runtime):
#   Every tool/MCP call is a `runner` container. This job builds the image, starts the
#   whole stack with `CONTAINER_DEFAULT_RUNTIME=runc`, and runs
#   `scripts/sandbox_smoke.py --tool text_stats`, which asserts from *inside* a real tool
#   container: JSON stdin/stdout round-trip, no egress under `network: none`, writable
#   tmpfs HOME/TMPDIR, and a registered hub tool executing through the same path MCP
#   callers use.
#
# What this job deliberately does NOT prove: gVisor. GitHub-hosted runners have no
# `runsc` registered, and registering one needs a privileged install the hosted runner
# does not offer -- so `runsc` stays a box-verified (manual / self-hosted) claim. That
# is why the leg pins `runc` explicitly instead of letting the runner's preflight fail
# on a runtime the host does not have. The gVisor isolation proof lives in
# `docker-compose.ci-isolation.yml` (`tests/live -m runsc`), which is run on a
# self-hosted host with runsc installed, not here.
#
# The v0.6 bwrap/landlock/egress/apparmor legs are gone with the backends they proved
# (v0.7.1): there is nothing left to select, so there is one job, not a matrix.
name: Sandbox smoke

on:
  workflow_dispatch:
  schedule:
    # Nightly: the runner image, the Docker version and the container runtime drift
    # under us, and this is the only job that boots the whole stack and runs a tool
    # through the runner.
    - cron: "17 4 * * *"
  push:
    paths:
      - "core/**"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "scripts/sandbox_smoke.py"
      - ".github/workflows/sandbox-smoke.yml"
  pull_request:
    paths:
      - "core/**"
      - "Dockerfile"
      - "docker-compose*.yml"
      - "scripts/sandbox_smoke.py"
      - ".github/workflows/sandbox-smoke.yml"

permissions:
  contents: read

concurrency:
  group: sandbox-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # The name is load-bearing: the release checklist and docs/deploy.md refer to the
    # `Sandbox smoke` job, and publish-images.yml refuses to publish a commit whose
    # workflows are not green.
    name: Sandbox smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record host evidence
        run: |
          echo "kernel: $(uname -r)"
          docker --version
          docker compose version
          docker info --format '{{json .SecurityOptions}}' || true
          # gVisor is expected to be ABSENT here; this is the runc leg by design.
          docker info --format '{{json .Runtimes}}' || true

      - name: Seed the .env the compose file expects
        # `host` and `ui` declare `env_file: .env`, and compose refuses to start without
        # the runner token, the agent-token HMAC key and the HOST path of the workspace.
        # Same shape as .env.example; only what this job needs to boot.
        run: |
          cat > .env <<ENV
          DEV_MODE=true
          SESSION_SECRET=sandbox-smoke-ci
          ADMIN_USERS=dev-user@local.host
          # Every app container runs as the runner uid, which owns the checkout.
          # GitHub runners use 1001, not the image default of 1000.
          TRELLIS_UID=$(id -u)
          TRELLIS_GID=$(id -g)
          # Required since v0.6: the runner's bearer token, the agent-token HMAC key
          # (>= 32 bytes), and the HOST path of the workspace that every tool bind mount
          # resolves against -- this checkout's workspace/ dir.
          RUNNER_TOKEN=0123456789abcdef0123456789abcdef
          AGENT_TOKEN_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          TRELLIS_HOST_WORKSPACE=$(pwd)/workspace
          # Build once, run everywhere: a local tag keeps the stack (and the tool
          # containers the runner starts, which use RUNNER_IMAGE) off GHCR and on the
          # image this job just built.
          TRELLIS_IMAGE=trellis-sandbox-smoke:ci
          # GitHub-hosted runners have runc, not runsc. Pinning it here is the honest
          # statement of what this leg proves; see the header.
          CONTAINER_DEFAULT_RUNTIME=runc
          # The smoke harness calls the hub directly (no host, no agent token), so the
          # agent-token gate runs in its documented rollout mode: it still verifies, but
          # a missing token is not a 403. This job proves the container contract, not the
          # token gate -- that is the unit suite's and the live runs' job.
          ENFORCE_AGENT_TOKENS=log
          ENV
          cat .env

      - name: Build the stack
        run: docker compose build

      - name: Start the stack
        # Every app service depends on `runner` being healthy, which needs the runner's
        # startup preflight + host-path canary to pass under runc.
        run: docker compose up -d

      - name: Wait for the hub and the runner to answer
        run: |
          : > healthz.json
          for attempt in $(seq 1 90); do
            runner=$(docker inspect runner --format '{{.State.Health.Status}}' 2>/dev/null || echo missing)
            body=$(docker compose exec -T hub curl -sf http://127.0.0.1:8001/healthz 2>/dev/null || true)
            if [ "$runner" = "healthy" ] && [ -n "$body" ]; then
              printf '%s' "$body" > healthz.json
              echo "hub answered and runner is healthy after ${attempt} attempt(s)"
              break
            fi
            sleep 5
          done
          if [ ! -s healthz.json ]; then
            echo "the stack did not become healthy within 7 minutes (runner: ${runner:-unknown})" >&2
            docker compose ps || true
            exit 1
          fi
          python3 -m json.tool healthz.json

      - name: Run the sandbox smoke harness
        # The harness registers a throwaway probe suite and executes it through the
        # runner, then runs the repo's own `text_stats` through `hub.run_tool`. It exits
        # non-zero on any failed check, and 2 when the environment itself is unusable.
        run: docker compose exec -T hub python scripts/sandbox_smoke.py --tool text_stats

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color runner || true
          docker compose logs --no-color hub || true
          docker compose logs --no-color db-sync || true

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true
