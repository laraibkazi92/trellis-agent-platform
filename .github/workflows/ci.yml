#
# CI v1: run the test suite on every push/PR to main.
# The suite is fully self-contained (mocked; no etcd/redis/LLM needed) — the
# TestLiveRegistry probes self-skip when no etcd is reachable, which is the
# normal case on a clean runner.
#
# Image publishing is automated in .github/workflows/publish-images.yml (triggered
# by a v* tag push): it publishes the multi-arch engine image to GHCR, which is the
# compose / `docker compose pull` install path. scripts/publish_images.sh stays the
# manual path for pushing both the app AND gateway images to your own registry, which
# is what the Helm chart under charts/trellis consumes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test suite (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest tests/ -q
