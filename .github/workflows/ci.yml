#
# CI v1: run the test suite on every push/PR to main.
# The suite is fully self-contained (mocked; no etcd/redis/LLM needed) — the
# TestLiveRegistry probes self-skip when no etcd is reachable, which is the
# normal case on a clean runner.
#
# Image publishing is automated in .github/workflows/publish-images.yml (triggered
# by a v* tag push): it publishes the multi-arch engine image to GHCR, which is the
# compose / `docker compose pull` install path. scripts/publish_images.sh stays the
# manual path for pushing both the app AND gateway images to your own registry.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The tests need to read the checkout and nothing else. Without this block the job
# inherits the repository default, which may grant write on every scope.
permissions:
  contents: read

jobs:
  tests:
    name: Test suite (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the test suite
        # pytest-timeout guard: a stuck test fails in 2 min with a thread dump instead of
        # burning the job timeout and reporting "cancelled" at 15 min (which hides the cause).
        run: python -m pytest tests/ -q --timeout=120 --timeout-method=thread
